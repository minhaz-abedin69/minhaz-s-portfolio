<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(20,20,24,.92);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .login-card h1 {
      margin: 0 0 8px;
    }

    .login-card p {
      margin: 0 0 24px;
      opacity: .7;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 7px;
      font-size: .9rem;
    }

    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: inherit;
      font: inherit;
    }

    .login-field input:focus {
      outline: 2px solid rgba(255,255,255,.2);
      outline-offset: 1px;
    }

    .login-button {
      width: 100%;
      margin-top: 8px;
    }

    .login-error {
      min-height: 20px;
      margin: 12px 0 0;
      color: #ff8f8f;
      font-size: .9rem;
    }
  </style>
</head>

<body data-page="login" class="ad-body">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Admin Login</h1>
      <p>Sign in to manage your portfolio.</p>

      <form id="loginForm">
        <div class="login-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="btn btn-primary login-button" type="submit">
          Sign in
        </button>

        <p id="loginError" class="login-error" role="alert"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      errorBox.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          errorBox.textContent = data.error || 'Invalid email or password.';
          return;
        }

        window.location.href = '/admin.html';
      } catch (error) {
        errorBox.textContent = 'Unable to connect to the server.';
      }
    });
  </script>
</body>
</html>
