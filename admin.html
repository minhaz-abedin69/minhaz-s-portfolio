<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0d0d0f">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="preload" href="assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script>
  (function () {
    const dialog = document.getElementById('adPasswordDialog');
    const openBtn = document.getElementById('adChangePasswordBtn');
    const cancelBtn = document.getElementById('adPasswordCancel');
    const form = document.getElementById('adPasswordForm');
    const message = document.getElementById('adPasswordMessage');
    const submitBtn = document.getElementById('adPasswordSubmit');

    function resetPasswordForm() {
      form.reset();
      message.textContent = '';
      message.removeAttribute('data-error');
    }

    openBtn.addEventListener('click', function () {
      resetPasswordForm();
      dialog.showModal();
    });

    cancelBtn.addEventListener('click', function () {
      dialog.close();
      resetPasswordForm();
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const currentPassword = document.getElementById('adCurrentPassword').value;
      const newPassword = document.getElementById('adNewPassword').value;
      const confirmPassword = document.getElementById('adConfirmPassword').value;

      message.textContent = '';
      message.removeAttribute('data-error');

      if (newPassword.length < 8) {
        message.textContent = 'New password must be at least 8 characters.';
        message.setAttribute('data-error', 'true');
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent = 'New passwords do not match.';
        message.setAttribute('data-error', 'true');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Changing...';

      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            currentPassword: currentPassword,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Password change failed.');
        }

        message.textContent = 'Password changed successfully.';
        message.removeAttribute('data-error');

        form.reset();

        setTimeout(function () {
          dialog.close();
          resetPasswordForm();
        }, 1200);

      } catch (error) {
        message.textContent = error.message;
        message.setAttribute('data-error', 'true');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Change Password';
      }
    });
  })();
  </script>
  <script>
(async function () {
  try {
    const response = await fetch('/api/auth/me', {
      credentials: 'same-origin'
    });

    if (!response.ok) {
      window.location.replace('/login.html');
      return;
    }

    const data = await response.json();

    if (!data.authenticated) {
      window.location.replace('/login.html');
    }
  } catch (error) {
    window.location.replace('/login.html');
  }
})();
</script>
<script src="js/data.js"></script>
    <script src="js/components.js"></script>
  </head>

    <a class="skip-link" href="#adMain">Skip to content</a>

      </aside>

      <div class="ad-col">

          <span class="ad-pill" id="adChanges">Up to date</span>
          <div class="ad-top-actions">
            <button type="button" class="icon-btn icon-btn-round" id="adUndo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>

            <button type="button" class="btn btn-sm btn-primary" id="adPublishBtn">Publish</button>
<button type="button" class="btn btn-sm" id="adChangePasswordBtn">Change Password</button>
<button type="button" class="btn btn-sm" id="adLogoutBtn">Logout</button>
          </div>
        </header>
        <main id="adMain" class="ad-main"></main>
      </div>
    </div>

    <dialog id="adPasswordDialog" class="ad-dialog" aria-labelledby="adPasswordTitle">
      <h2 id="adPasswordTitle">Change Password</h2>

      <form id="adPasswordForm">
        <label>
          Current Password
          <input
            type="password"
            id="adCurrentPassword"
            name="currentPassword"
            autocomplete="current-password"
            required
          >
        </label>

        <label>
          New Password
          <input
            type="password"
            id="adNewPassword"
            name="newPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <label>
          Confirm New Password
          <input
            type="password"
            id="adConfirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <p id="adPasswordMessage" class="ad-muted" role="status"></p>

        <div class="ad-actions">
          <button type="button" class="btn btn-sm" id="adPasswordCancel">Cancel</button>
          <button type="submit" class="btn btn-sm btn-primary" id="adPasswordSubmit">
            Change Password
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="adConfirm" class="ad-dialog" aria-labelledby="adConfirmText">
      <p id="adConfirmText"></p>
      <div class="ad-actions"><button type="button" class="btn btn-sm" id="adConfirmNo">Cancel</button><button type="button" class="btn btn-sm btn-primary" id="adConfirmOk">OK</button></div>
    </dialog>

    <noscript><p class="noscript">The admin panel needs JavaScript.</p></noscript>
    <script src="js/admin/core.js" defer></script>
    <script src="js/admin/schema.js" defer></script>
    <script src="js/admin/forms.js" defer></script>
    <script src="js/admin/github.js" defer></script>
    <script src="js/admin/app.js" defer></script>
  <script>
  document.getElementById('adLogoutBtn').addEventListener('click', async function () {
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        credentials: 'same-origin'
      });
    } finally {
      window.location.replace('/login.html');
    }
  });
</script>
</body>
</html>
